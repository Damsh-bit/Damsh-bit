# Genera la animación del snake a partir del gráfico de contribuciones
# y la publica en la rama `output` (el README la lee desde ahí).
name: Snake de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#070707&color_dots=#ebedf0,#d4d4d8,#a1a1aa,#52525b,#18181b
            dist/snake-dark.svg?palette=github-dark&color_snake=#f5f5f7&color_dots=#161b22,#3f3f46,#71717a,#d4d4d8,#fafafa

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: actualizar snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
